appId: sh.ringo.yachiyo
productName: Yachiyo
directories:
  buildResources: build
files:
  - '!**/*'
  - 'out/**'
  - '!out/runtime-node-modules{,/**}'
  - 'package.json'
  - 'resources/icon.png'
extraResources:
  - from: out/runtime-node-modules/node_modules
    to: node_modules
    filter:
      - '**/*'
  - from: ../../packages/core-skills/core-skills
    to: core-skills
  - from: resources/bin/${os}-${arch}
    to: bin
    filter:
      - '**/*'
  - from: resources/licenses
    to: licenses
    filter:
      - '**/*'
win:
  executableName: yachiyo
  electronLanguages:
    - en-US
    - zh-CN
  target:
    - target: nsis
      arch:
        - x64
nsis:
  include: build/installer.nsh
  artifactName: yachiyo-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  electronLanguages:
    - en
    - zh_CN
  extraResources:
    - from: ../../native/vision-ocr/.build/release/vision-ocr
      to: external-hooks/vision-ocr
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  electronLanguages:
    - en-US
    - zh-CN
  target:
    - AppImage
    - snap
    - deb
  maintainer: Yachiyo
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
publish:
  provider: github
  owner: ringotypowriter
  repo: yachiyo
  releaseType: release
npmRebuild: true
