# XcodeGen spec; `xcodegen generate` produces YachiyoRemote.xcodeproj (not committed).
name: YachiyoRemote
options:
  bundleIdPrefix: sh.ringo.yachiyo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: DU5US35N5Y
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
packages:
  YachiyoRemoteKit:
    path: YachiyoRemoteKit
  YachiyoChatUI:
    path: YachiyoChatUI
targets:
  YachiyoRemote:
    type: application
    platform: iOS
    sources:
      - path: YachiyoRemote
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: YachiyoRemoteKit
      - package: YachiyoChatUI
        product: YachiyoChatUI
      - package: YachiyoChatUI
        product: YachiyoMaterial
    info:
      path: YachiyoRemote/Info.plist
      properties:
        CFBundleDisplayName: Yachiyo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # iPad multitasking requires every orientation.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: sh.ringo.yachiyo.remote.pair
            CFBundleURLSchemes: [yachiyo-remote]
        NSCameraUsageDescription: Scan the pairing code shown on your Mac, or attach a photo.
        NSPhotoLibraryUsageDescription: Attach photos to a message.
        NSMicrophoneUsageDescription: Dictate messages.
        NSSpeechRecognitionUsageDescription: Turn your voice into message text on this iPhone.
        NSLocalNetworkUsageDescription: Connect to Yachiyo on your Mac over the local network.
        # All encryption goes through Apple's CryptoKit / Security frameworks (exempt).
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Remote traffic is end-to-end encrypted by the app; LAN endpoints use plain ws://.
          NSAllowsLocalNetworking: true
    postBuildScripts:
      # Settings > About shows this commit so a build can be traced to its source. Without git
      # (for example a source archive) the key is left out rather than guessed.
      - name: Embed git commit
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :YachiyoGitCommit" "$plist" >/dev/null 2>&1 || true
          if commit=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null); then
            /usr/libexec/PlistBuddy -c "Add :YachiyoGitCommit string $commit" "$plist"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.ringo.yachiyo.remote
        PRODUCT_NAME: Yachiyo
        INFOPLIST_KEY_CFBundleDisplayName: Yachiyo
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The commit script reads the repository's .git, which a sandboxed script cannot reach.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  YachiyoRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: YachiyoRemoteUITests
    dependencies:
      - target: YachiyoRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sh.ringo.yachiyo.remote.uitests
        TEST_TARGET_NAME: YachiyoRemote
        GENERATE_INFOPLIST_FILE: YES
schemes:
  YachiyoRemote:
    build:
      targets:
        YachiyoRemote: all
        YachiyoRemoteUITests: [test]
    test:
      targets:
        - YachiyoRemoteUITests
