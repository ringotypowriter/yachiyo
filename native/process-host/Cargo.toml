[package]
name = "process-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "process-host"
path = "src/main.rs"

[[bin]]
name = "export-process-host-bindings"
path = "src/bin/export_bindings.rs"

[dependencies]
command-group = { version = "5.0.1", features = ["with-tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
ts-rs = "12.0.1"

