name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:server

      - name: Cache sync-core Cargo build
        uses: actions/cache@v4
        with:
          path: native/sync-core/target
          key: ${{ runner.os }}-${{ runner.arch }}-sync-core-${{ hashFiles('native/sync-core/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-sync-core-

      - name: Test native server behavior
        run: pnpm run test:server:native

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Windows runtime
        run: pnpm --filter @yachiyo/desktop run windows-runtime:prepare

      - name: Test Windows app update IPC
        run: node --experimental-strip-types --test apps/desktop/src/main/cli/commandSocket.appUpdate.test.ts

      - name: Test pure server behavior
        run: pnpm run test:server

      - name: Typecheck
        run: pnpm run typecheck
