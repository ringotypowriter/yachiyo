name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.0.3)'
        required: true

jobs:
  build_macos:
    name: Build and publish macOS
    runs-on: macos-latest
    environment: Mac Distribution
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS archive
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm --filter @yachiyo/desktop run build:mac

      - name: Publish macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          shopt -s nullglob
          files=(
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.zip.blockmap
            apps/desktop/dist/latest-mac.yml
          )
          if [ "${#files[@]}" -ne 3 ]; then
            echo "Expected the macOS ZIP, blockmap, and latest-mac.yml; found ${#files[@]} files." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

      - name: Preserve macOS release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.zip.blockmap
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

      - name: Generate changelog and update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"

          # Find the stable tag immediately before the requested tag, ignoring beta tags as boundaries
          PREV_TAG=$(git tag --sort=v:refname | awk -v t="$TAG" '$0 == t {print prev; exit} $0 !~ /beta/ {prev=$0}')

          if [ -z "$PREV_TAG" ]; then
            RANGE="$TAG"
          else
            RANGE="${PREV_TAG}..${TAG}"
          fi

          # Collect commits, skip chore/ci and merge commits
          FEATS=$(git log "$RANGE" --oneline --no-merges --grep="^feat" --format="- %s (%h)" | sed 's/^- feat[^:]*: /- /')
          FIXES=$(git log "$RANGE" --oneline --no-merges --grep="^fix" --format="- %s (%h)" | sed 's/^- fix[^:]*: /- /')
          REFACTORS=$(git log "$RANGE" --oneline --no-merges --grep="^refactor" --format="- %s (%h)" | sed 's/^- refactor[^:]*: /- /')

          BODY=""
          if [ -n "$FEATS" ]; then
            BODY="${BODY}## Features\n${FEATS}\n\n"
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}## Bug Fixes\n${FIXES}\n\n"
          fi
          if [ -n "$REFACTORS" ]; then
            BODY="${BODY}## Refactors\n${REFACTORS}\n\n"
          fi

          if [ -z "$BODY" ]; then
            if [ -n "$PREV_TAG" ]; then
              BODY="Maintenance release — see [commit history](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}) for details."
            else
              BODY="Initial release."
            fi
          fi

          printf '%b' "$BODY" | gh release edit "$TAG" --notes-file -

  build_windows:
    name: Build and publish Windows x64
    needs: build_macos
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Windows installer
        run: pnpm --filter @yachiyo/desktop run build:win

      - name: Publish Windows artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          $files = @(
            Get-ChildItem apps/desktop/dist -File |
              Where-Object {
                $_.Name -eq 'latest.yml' -or
                $_.Name -match '^yachiyo-.+-setup\.exe(?:\.blockmap)?$'
              }
          )
          if ($files.Count -ne 3) {
            throw "Expected the NSIS installer, blockmap, and latest.yml; found $($files.Count) files."
          }
          foreach ($file in $files) {
            gh release upload $env:RELEASE_TAG $file.FullName --clobber
          }

      - name: Preserve Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            apps/desktop/dist/yachiyo-*-setup.exe
            apps/desktop/dist/yachiyo-*-setup.exe.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  mirror:
    name: Sync aggregated release artifacts to R2
    needs: [build_macos, build_windows]
    runs-on: ubuntu-latest
    environment: Mac Distribution
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: apps/desktop/dist
          merge-multiple: true

      - name: Sync release to R2 mirror
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: node scripts/sync-release-to-r2.mjs --channel stable --dist apps/desktop/dist
